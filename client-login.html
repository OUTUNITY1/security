<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập Client — SecureX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
</head>
<body>
  <div class="login-page">
    <div class="login-card glass">
      <a href="index.html" class="logo">
        <div class="logo-icon">🛡</div>
        SecureX
      </a>
      <h2>Đăng nhập Client</h2>
      <p>Truy cập cổng bảo mật dành cho khách hàng</p>

      <div id="errorMsg" style="display:none; background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.4); color:#f87171; padding:12px 16px; border-radius:10px; margin-bottom:16px; font-size:0.9rem;"></div>
      <div id="successMsg" style="display:none; background:rgba(34,197,94,0.15); border:1px solid rgba(34,197,94,0.4); color:#4ade80; padding:12px 16px; border-radius:10px; margin-bottom:16px; font-size:0.9rem;"></div>

      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="email@company.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.85rem;">
          <label style="display: flex; align-items: center; gap: 8px; color: var(--text-secondary); cursor: pointer;">
            <input type="checkbox" id="rememberMe" style="accent-color: var(--accent);"> Ghi nhớ đăng nhập
          </label>
          <a href="#" id="forgotPassword" style="color: var(--accent);">Quên mật khẩu?</a>
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">Đăng nhập →</button>
      </form>
      <div class="login-footer">
        <p>Chưa có tài khoản? <a href="client-register.html">Đăng ký miễn phí</a></p>
        <p style="margin-top:8px;"><a href="index.html">← Quay lại trang chủ</a> · <a href="login.html">Admin Login</a></p>
      </div>
    </div>
  </div>

  <script>
    auth.onAuthStateChanged((user) => {
      if (user) {
        // If admin tries client login, still allow but they can go admin
        if (isAdminUser(user)) {
          // optional: redirect to admin
        }
        // For now after login we can show a simple client portal or redirect to index with logged in state
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('errorMsg');
      const sucEl = document.getElementById('successMsg');

      errEl.style.display = 'none';
      sucEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Đang đăng nhập...';

      try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const user = userCredential.user;

        // Update last login
        await database.ref('users/' + user.uid).update({
          lastLogin: firebase.database.ServerValue.TIMESTAMP
        });

        // Load profile
        const snapshot = await database.ref('users/' + user.uid).once('value');
        const profile = snapshot.val() || {};

        localStorage.setItem('securex_client_auth', 'true');
        localStorage.setItem('securex_client_user', JSON.stringify({
          uid: user.uid,
          email: user.email,
          displayName: profile.displayName || user.displayName || 'Client',
          country: profile.country || '',
          role: profile.role || 'client'
        }));

        sucEl.style.display = 'block';
        sucEl.textContent = 'Đăng nhập thành công!';
        
        // Redirect to a simple client dashboard or back to index
        setTimeout(() => {
          window.location.href = 'client-dashboard.html';
        }, 800);

      } catch (error) {
        console.error(error);
        let msg = 'Email hoặc mật khẩu không đúng.';
        if (error.code === 'auth/too-many-requests') {
          msg = 'Quá nhiều lần thử. Vui lòng thử lại sau.';
        } else if (error.code === 'auth/user-not-found') {
          msg = 'Tài khoản không tồn tại. Hãy đăng ký trước.';
        }
        errEl.style.display = 'block';
        errEl.textContent = msg;
        btn.disabled = false;
        btn.textContent = 'Đăng nhập →';
      }
    });

    document.getElementById('forgotPassword').addEventListener('click', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) {
        alert('Vui lòng nhập email trước.');
        return;
      }
      try {
        await auth.sendPasswordResetEmail(email);
        document.getElementById('successMsg').style.display = 'block';
        document.getElementById('successMsg').textContent = 'Đã gửi email đặt lại mật khẩu tới ' + email;
      } catch (err) {
        document.getElementById('errorMsg').style.display = 'block';
        document.getElementById('errorMsg').textContent = err.message;
      }
    });
  </script>
</body>
</html>
