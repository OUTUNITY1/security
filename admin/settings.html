<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cài đặt — SecureX Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="../index.html" class="logo"><div class="logo-icon">🛡</div> SecureX</a>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Tổng quan</div>
          <a href="dashboard.html"><span class="icon">📊</span> Dashboard</a>
          <a href="threats.html"><span class="icon">⚠</span> Threats <span class="badge">12</span></a>
          <a href="tickets.html"><span class="icon">🎫</span> Tickets <span class="badge">5</span></a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Quản lý</div>
          <a href="clients.html"><span class="icon">👥</span> Khách hàng</a>
          <a href="reports.html"><span class="icon">📋</span> Báo cáo</a>
          <a href="assets.html"><span class="icon">💻</span> Assets</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Hệ thống</div>
          <a href="settings.html" class="active"><span class="icon">⚙</span> Cài đặt</a>
          <a href="team.html"><span class="icon">🧑‍💻</span> Đội ngũ</a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info" onclick="logout()">
          <div class="user-avatar">AD</div>
          <div class="user-details"><h5>Admin SecureX</h5><span>Super Admin</span></div>
        </div>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <h1>Cài đặt hệ thống</h1>
          <p>Cấu hình platform và thông báo</p>
        </div>
        <div class="topbar-right">
          <button class="icon-btn" onclick="toggleSidebar()">☰</button>
        </div>
      </header>

      <div class="dashboard-content">
        <div class="dashboard-row" style="grid-template-columns: 1fr 1fr;">
          <div class="dashboard-card glass">
            <div class="card-header"><h3>Thông tin tài khoản</h3></div>
            <div class="form-group">
              <label>Tên hiển thị</label>
              <input type="text" value="Admin SecureX">
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" value="admin@securex.vn">
            </div>
            <div class="form-group">
              <label>Vai trò</label>
              <input type="text" value="Super Admin" disabled>
            </div>
            <button class="btn btn-primary btn-sm" onclick="alert('Đã lưu!')">Lưu thay đổi</button>
          </div>

          <div class="dashboard-card glass">
            <div class="card-header"><h3>Bảo mật</h3></div>
            <div class="form-group">
              <label>Mật khẩu hiện tại</label>
              <input type="password" placeholder="••••••••">
            </div>
            <div class="form-group">
              <label>Mật khẩu mới</label>
              <input type="password" placeholder="••••••••">
            </div>
            <div class="form-group">
              <label>Xác nhận mật khẩu</label>
              <input type="password" placeholder="••••••••">
            </div>
            <button class="btn btn-primary btn-sm" onclick="alert('Mật khẩu đã được cập nhật!')">Đổi mật khẩu</button>
          </div>
        </div>

        <div class="dashboard-card glass" style="margin-top: 24px;">
          <div class="card-header"><h3>Thông báo & Alert</h3></div>
          <div style="display: grid; gap: 16px;">
            <label style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border);">
              <span>Email alert khi có Critical threat</span>
              <input type="checkbox" checked style="accent-color: var(--accent); width: 18px; height: 18px;">
            </label>
            <label style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border);">
              <span>Slack notification cho ticket mới</span>
              <input type="checkbox" checked style="accent-color: var(--accent); width: 18px; height: 18px;">
            </label>
            <label style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border);">
              <span>SMS khi SLA sắp hết hạn</span>
              <input type="checkbox" style="accent-color: var(--accent); width: 18px; height: 18px;">
            </label>
            <label style="display: flex; align-items: center; justify-content: space-between; padding: 12px 0;">
              <span>Weekly summary report</span>
              <input type="checkbox" checked style="accent-color: var(--accent); width: 18px; height: 18px;">
            </label>
          </div>
        </div>

        <div class="dashboard-card glass" style="margin-top: 24px;">
          <div class="card-header"><h3>API & Integrations</h3></div>
          <div class="form-group">
            <label>API Key</label>
            <input type="text" value="sx_live_sk_2026_xxxxxxxxxxxxxxxxxxxx" readonly>
          </div>
          <div style="display: flex; gap: 12px; margin-top: 8px;">
            <button class="btn btn-outline btn-sm" onclick="alert('API Key copied!')">Copy</button>
            <button class="btn btn-outline btn-sm" onclick="alert('API Key regenerated!')">Regenerate</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/admin.js"></script>
  <script>if (!localStorage.getItem('securex_auth')) window.location.href = '../login.html';</script>
</body>
</html>
