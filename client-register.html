<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký Client — SecureX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
</head>
<body>
  <div class="login-page">
    <div class="login-card glass" style="max-width: 480px;">
      <a href="index.html" class="logo">
        <div class="logo-icon">🛡</div>
        SecureX
      </a>
      <h2>Đăng ký tài khoản Client</h2>
      <p>Tạo tài khoản để quản lý bảo mật doanh nghiệp của bạn</p>

      <div id="errorMsg" style="display:none; background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.4); color:#f87171; padding:12px 16px; border-radius:10px; margin-bottom:16px; font-size:0.9rem;"></div>
      <div id="successMsg" style="display:none; background:rgba(34,197,94,0.15); border:1px solid rgba(34,197,94,0.4); color:#4ade80; padding:12px 16px; border-radius:10px; margin-bottom:16px; font-size:0.9rem;"></div>

      <form id="registerForm">
        <div class="form-group">
          <label>Họ và tên / Tên công ty</label>
          <input type="text" id="displayName" placeholder="Công ty ABC / Nguyễn Văn A" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="email@company.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="password" placeholder="Tối thiểu 6 ký tự" required minlength="6" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label>Xác nhận mật khẩu</label>
          <input type="password" id="password2" placeholder="Nhập lại mật khẩu" required minlength="6">
        </div>
        <div class="form-row" style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div class="form-group">
            <label>Quốc gia</label>
            <select id="country" required>
              <option value="">Chọn quốc gia</option>
              <option value="VN">Việt Nam</option>
              <option value="US">United States</option>
              <option value="SG">Singapore</option>
              <option value="JP">Japan</option>
              <option value="KR">South Korea</option>
              <option value="TH">Thailand</option>
              <option value="ID">Indonesia</option>
              <option value="MY">Malaysia</option>
              <option value="PH">Philippines</option>
              <option value="AU">Australia</option>
              <option value="OTHER">Khác</option>
            </select>
          </div>
          <div class="form-group">
            <label>Số điện thoại</label>
            <input type="tel" id="phone" placeholder="+84 900 000 000">
          </div>
        </div>
        <div class="form-group">
          <label>Ngành nghề</label>
          <select id="industry">
            <option value="">Chọn ngành</option>
            <option value="Banking">Banking / Tài chính</option>
            <option value="Fintech">Fintech</option>
            <option value="Healthcare">Y tế / Healthcare</option>
            <option value="E-commerce">E-commerce</option>
            <option value="Manufacturing">Sản xuất</option>
            <option value="Education">Giáo dục</option>
            <option value="Government">Chính phủ</option>
            <option value="Other">Khác</option>
          </select>
        </div>
        <div class="form-group">
          <label>Gói quan tâm</label>
          <select id="package">
            <option value="Starter">Starter</option>
            <option value="AI Detection Pro">AI Detection Pro</option>
            <option value="Enterprise SOC">Enterprise SOC</option>
            <option value="Custom">Tư vấn Custom</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary" id="regBtn" style="width:100%; justify-content:center;">Đăng ký ngay →</button>
      </form>
      <div class="login-footer">
        <p>Đã có tài khoản? <a href="client-login.html">Đăng nhập Client</a></p>
        <p style="margin-top:8px;"><a href="index.html">← Quay lại trang chủ</a> · <a href="login.html">Admin Login</a></p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const displayName = document.getElementById('displayName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      const country = document.getElementById('country').value;
      const phone = document.getElementById('phone').value.trim();
      const industry = document.getElementById('industry').value;
      const pkg = document.getElementById('package').value;

      const errEl = document.getElementById('errorMsg');
      const sucEl = document.getElementById('successMsg');
      const btn = document.getElementById('regBtn');

      errEl.style.display = 'none';
      sucEl.style.display = 'none';

      if (password !== password2) {
        errEl.style.display = 'block';
        errEl.textContent = 'Mật khẩu xác nhận không khớp.';
        return;
      }
      if (email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
        errEl.style.display = 'block';
        errEl.textContent = 'Email này dành cho Admin. Vui lòng dùng email khác.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Đang đăng ký...';

      try {
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;

        // Update display name
        await user.updateProfile({ displayName: displayName });

        // Store full profile + metrics in Realtime Database under users/$uid
        // (matches the security rules: only own uid can read/write)
        const userData = {
          uid: user.uid,
          email: email,
          displayName: displayName,
          role: 'client',
          country: country,
          phone: phone || null,
          industry: industry || null,
          package: pkg,
          // Client metrics (initial)
          healthScore: 100,
          threats30d: 0,
          openTickets: 0,
          status: 'Healthy',
          createdAt: firebase.database.ServerValue.TIMESTAMP,
          lastLogin: firebase.database.ServerValue.TIMESTAMP,
          // Additional metrics placeholders
          metrics: {
            uptime: 99.99,
            threatsBlocked: 0,
            incidentsResolved: 0,
            avgResponseMs: 0
          }
        };

        await database.ref('users/' + user.uid).set(userData);

        sucEl.style.display = 'block';
        sucEl.textContent = 'Đăng ký thành công! Bạn có thể đăng nhập ngay.';
        
        setTimeout(() => {
          window.location.href = 'client-login.html';
        }, 1500);

      } catch (error) {
        console.error(error);
        let msg = error.message;
        if (error.code === 'auth/email-already-in-use') {
          msg = 'Email này đã được sử dụng. Vui lòng đăng nhập hoặc dùng email khác.';
        } else if (error.code === 'auth/weak-password') {
          msg = 'Mật khẩu quá yếu. Tối thiểu 6 ký tự.';
        } else if (error.code === 'auth/invalid-email') {
          msg = 'Email không hợp lệ.';
        }
        errEl.style.display = 'block';
        errEl.textContent = msg;
        btn.disabled = false;
        btn.textContent = 'Đăng ký ngay →';
      }
    });
  </script>
</body>
</html>
