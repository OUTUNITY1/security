<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập — SecureX Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
</head>
<body>
  <div class="login-page">
    <div class="login-card glass">
      <a href="index.html" class="logo">
        <div class="logo-icon">🛡</div>
        SecureX
      </a>
      <h2>Đăng nhập Admin</h2>
      <p>Truy cập bảng điều khiển bảo mật SecureX</p>
      
      <div id="errorMsg" style="display:none; background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.4); color:#f87171; padding:12px 16px; border-radius:10px; margin-bottom:16px; font-size:0.9rem;"></div>
      <div id="successMsg" style="display:none; background:rgba(34,197,94,0.15); border:1px solid rgba(34,197,94,0.4); color:#4ade80; padding:12px 16px; border-radius:10px; margin-bottom:16px; font-size:0.9rem;"></div>

      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="admin@securex.vn" required autocomplete="email">
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.85rem;">
          <label style="display: flex; align-items: center; gap: 8px; color: var(--text-secondary); cursor: pointer;">
            <input type="checkbox" id="rememberMe" style="accent-color: var(--accent);"> Ghi nhớ đăng nhập
          </label>
          <a href="#" id="forgotPassword" style="color: var(--accent);">Quên mật khẩu?</a>
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">Đăng nhập →</button>
      </form>
      <div class="login-footer">
        <p style="margin-top: 12px; color: var(--text-muted); font-size: 0.85rem;">
          Chỉ tài khoản <strong>lga775385@gmail.com</strong> được phép truy cập Admin.
        </p>
        <p style="margin-top: 8px;"><a href="index.html">← Quay lại trang chủ</a> · <a href="client-register.html">Đăng ký Client</a></p>
      </div>
    </div>
  </div>

  <script>
    // Show error from URL
    const params = new URLSearchParams(window.location.search);
    if (params.get('error') === 'admin_only') {
      const err = document.getElementById('errorMsg');
      err.style.display = 'block';
      err.textContent = 'Chỉ tài khoản Admin (lga775385@gmail.com) mới được truy cập trang quản trị.';
    }

    // Already logged in as admin? → dashboard
    auth.onAuthStateChanged((user) => {
      if (user && isAdminUser(user)) {
        window.location.href = 'admin/dashboard.html';
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('errorMsg');
      const sucEl = document.getElementById('successMsg');

      errEl.style.display = 'none';
      sucEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Đang đăng nhập...';

      try {
        // Only allow the specific admin email
        if (email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
          throw new Error('Chỉ tài khoản Admin (lga775385@gmail.com) được phép đăng nhập trang này.');
        }

        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const user = userCredential.user;

        // Double-check
        if (!isAdminUser(user)) {
          await auth.signOut();
          throw new Error('Tài khoản này không có quyền Admin.');
        }

        // Save minimal info (optional, for UI)
        localStorage.setItem('securex_auth', 'true');
        localStorage.setItem('securex_user', JSON.stringify({
          name: user.displayName || 'Admin SecureX',
          email: user.email,
          role: 'Super Admin',
          uid: user.uid
        }));

        // Update last login in DB (chỉ ghi profile của chính mình – tuân thủ rules)
        await userRef(user.uid).update({
          email: user.email,
          role: 'admin',
          lastLogin: firebase.database.ServerValue.TIMESTAMP,
          displayName: user.displayName || 'Admin SecureX'
        });

        sucEl.style.display = 'block';
        sucEl.textContent = 'Đăng nhập thành công! Đang chuyển hướng...';
        setTimeout(() => {
          window.location.href = 'admin/dashboard.html';
        }, 800);

      } catch (error) {
        console.error(error);
        let msg = error.message || 'Đăng nhập thất bại.';
        if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
          msg = 'Email hoặc mật khẩu không đúng.';
        } else if (error.code === 'auth/too-many-requests') {
          msg = 'Quá nhiều lần thử. Vui lòng thử lại sau.';
        }
        errEl.style.display = 'block';
        errEl.textContent = msg;
        btn.disabled = false;
        btn.textContent = 'Đăng nhập →';
      }
    });

    // Forgot password
    document.getElementById('forgotPassword').addEventListener('click', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim() || ADMIN_EMAIL;
      if (!email) {
        alert('Vui lòng nhập email trước.');
        return;
      }
      try {
        await auth.sendPasswordResetEmail(email);
        document.getElementById('successMsg').style.display = 'block';
        document.getElementById('successMsg').textContent = 'Đã gửi email đặt lại mật khẩu tới ' + email;
      } catch (err) {
        document.getElementById('errorMsg').style.display = 'block';
        document.getElementById('errorMsg').textContent = err.message;
      }
    });
  </script>
</body>
</html>
