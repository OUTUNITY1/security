<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập — SecureX Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card glass">
      <a href="index.html" class="logo">
        <div class="logo-icon">🛡</div>
        SecureX
      </a>
      <h2>Đăng nhập Admin</h2>
      <p>Truy cập bảng điều khiển bảo mật SecureX</p>
      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="admin@securex.vn" value="admin@securex.vn" required>
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="password" placeholder="••••••••" value="admin123" required>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.85rem;">
          <label style="display: flex; align-items: center; gap: 8px; color: var(--text-secondary); cursor: pointer;">
            <input type="checkbox" checked style="accent-color: var(--accent);"> Ghi nhớ đăng nhập
          </label>
          <a href="#" style="color: var(--accent);">Quên mật khẩu?</a>
        </div>
        <button type="submit" class="btn btn-primary">Đăng nhập →</button>
      </form>
      <div class="login-footer">
        <p>Demo: admin@securex.vn / admin123</p>
        <p style="margin-top: 8px;"><a href="index.html">← Quay lại trang chủ</a></p>
      </div>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if (email === 'admin@securex.vn' && password === 'admin123') {
        localStorage.setItem('securex_auth', 'true');
        localStorage.setItem('securex_user', JSON.stringify({
          name: 'Admin SecureX',
          email: 'admin@securex.vn',
          role: 'Super Admin'
        }));
        window.location.href = 'admin/dashboard.html';
      } else {
        alert('Email hoặc mật khẩu không đúng!\nDemo: admin@securex.vn / admin123');
      }
    });
  </script>
</body>
</html>
