<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sổ trực ca bảo vệ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="badge" aria-hidden="true">BV</span>
      <div>
        <h1>Sổ trực ca bảo vệ</h1>
        <p id="shiftInfo">Chưa nhận ca</p>
      </div>
    </div>
    <div class="clock">
      <time id="clock">--:--:--</time>
      <span id="date"></span>
    </div>
  </header>

  <main>
    <section class="panel shift" aria-labelledby="h-shift">
      <h2 id="h-shift">Nhận / bàn giao ca</h2>
      <div class="row">
        <input id="guardName" type="text" placeholder="Họ tên bảo vệ trực ca" autocomplete="name">
        <button id="shiftBtn" class="btn primary">Nhận ca</button>
      </div>
    </section>

    <section class="panel patrol" aria-labelledby="h-patrol">
      <div class="panel-head">
        <h2 id="h-patrol">Tuần tra theo tuyến</h2>
        <button id="resetRound" class="btn ghost">Bắt đầu vòng mới</button>
      </div>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="bar"></div>
      </div>
      <p id="progressText" class="muted"></p>
      <ul id="checkpoints" class="checkpoints"></ul>
    </section>

    <section class="panel logs">
      <div class="tabs" role="tablist">
        <button class="tab active" role="tab" data-tab="incidents" aria-selected="true">Sự cố <span id="cntInc" class="count">0</span></button>
        <button class="tab" role="tab" data-tab="visitors" aria-selected="false">Khách ra vào <span id="cntVis" class="count">0</span></button>
      </div>

      <div id="tab-incidents" class="tabpane">
        <form id="incForm" class="form">
          <select id="incType" required>
            <option value="">Loại sự cố</option>
            <option>Người lạ khả nghi</option>
            <option>Mất / thất lạc tài sản</option>
            <option>Cháy nổ / nguy cơ cháy</option>
            <option>Hỏng thiết bị, cửa, khóa</option>
            <option>Vi phạm nội quy</option>
            <option>Khác</option>
          </select>
          <input id="incPlace" type="text" placeholder="Vị trí xảy ra" required>
          <select id="incLevel">
            <option value="low">Mức nhẹ</option>
            <option value="mid">Mức vừa</option>
            <option value="high">Khẩn cấp</option>
          </select>
          <textarea id="incDesc" rows="3" placeholder="Mô tả và cách xử lý" required></textarea>
          <button class="btn primary" type="submit">Ghi sự cố</button>
        </form>
        <ul id="incList" class="entries"></ul>
      </div>

      <div id="tab-visitors" class="tabpane" hidden>
        <form id="visForm" class="form">
          <input id="visName" type="text" placeholder="Họ tên khách" required>
          <input id="visId" type="text" placeholder="CCCD hoặc biển số xe">
          <input id="visTo" type="text" placeholder="Liên hệ với ai / bộ phận" required>
          <button class="btn primary" type="submit">Ghi khách vào</button>
        </form>
        <ul id="visList" class="entries"></ul>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="js/app.js"></script>
</body>
</html>
